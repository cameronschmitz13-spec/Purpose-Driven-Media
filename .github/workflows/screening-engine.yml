name: Screening Engine

on:
  push:
    paths:
      - "screening-engine/**"
      - "docs/SCREENING_ENGINE_STACK.md"
      - "qa/fixtures/**"
      - ".github/workflows/screening-engine.yml"
  pull_request:
    paths:
      - "screening-engine/**"
      - "docs/SCREENING_ENGINE_STACK.md"
      - "qa/fixtures/**"
      - ".github/workflows/screening-engine.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format check
        run: deno fmt --check screening-engine

      - name: Type check
        run: deno check screening-engine/cli.ts screening-engine/tests/engine_test.ts

      - name: Identity and scoring regression tests
        run: deno test screening-engine/tests
